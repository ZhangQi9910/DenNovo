name: tests

on:
  push:
  pull_request:

jobs:
  utility-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test dependency
        run: python -m pip install numpy
      - name: Run utility tests
        run: python -m unittest discover -s tests -v
